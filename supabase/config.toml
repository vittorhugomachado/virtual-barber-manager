# Funções chamadas por terceiros (Asaas / pg_cron) NÃO recebem JWT do Supabase —
# elas autenticam por header secreto. Verify JWT precisa ficar OFF, senão o
# chamador toma 401 antes da função rodar (foi o que travou o webhook).
[functions.asaas-webhook]
verify_jwt = false

[functions.reconcile-subscriptions]
verify_jwt = false

# Chamadas pelo dono logado no manager — recebem o JWT do usuário. Mantém ON.
[functions.create-monthly-subscription]
verify_jwt = true

[functions.buy-pack]
verify_jwt = true
